{% extends 'base.html' %}
{% block title %}Submit an Event — SG Gazette{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <h2 class="section-title">Submit a Community Event</h2>
      <p class="text-muted mb-4">Events are reviewed and published within 24 hours.</p>

      <div class="card">
        <div class="card-body p-4">
          <form method="post">
            <div class="mb-3">
              <label class="form-label fw-semibold">Event Title *</label>
              <input type="text" name="title" class="form-control" required placeholder="e.g. Spruce Grove Farmers Market">
            </div>
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Start Date & Time *</label>
                <input type="datetime-local" name="start_date" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">End Date & Time</label>
                <input type="datetime-local" name="end_date" class="form-control">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Location</label>
              <input type="text" name="location" class="form-control" placeholder="e.g. Spruce Grove Civic Centre">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Category</label>
              <select name="category" class="form-select">
                {% for cat in ['Community','Sports','Arts & Culture','Family','Business','Health','Other'] %}
                <option>{{ cat }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Description</label>
              <textarea name="description" class="form-control" rows="4"
                        placeholder="Tell the community about your event…"></textarea>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Contact / Website</label>
              <input type="text" name="contact" class="form-control"
                     placeholder="email@example.com or https://…">
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-gazette px-4">Submit Event</button>
              <a href="{{ url_for('events') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
