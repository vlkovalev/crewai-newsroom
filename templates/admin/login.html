{% extends 'base.html' %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card shadow">
        <div class="card-body p-4">
          <h4 class="text-center fw-bold mb-4"><i class="bi bi-shield-lock"></i> Staff Login</h4>
          <form method="post">
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" name="password" class="form-control" autofocus required>
            </div>
            <button type="submit" class="btn btn-gazette w-100">Login</button>
          </form>
          <div class="text-center mt-3">
            <a href="{{ url_for('index') }}" class="text-muted small">← Back to site</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
