{% extends 'base.html' %}
{% block title %}List Your Business — SG Gazette{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <h2 class="section-title">List Your Business</h2>
      <p class="text-muted mb-4">Free basic listings for Spruce Grove businesses. Listings are reviewed before publishing.</p>

      <div class="card">
        <div class="card-body p-4">
          <form method="post">
            <div class="mb-3">
              <label class="form-label fw-semibold">Business Name *</label>
              <input type="text" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Category</label>
              <select name="category" class="form-select">
                {% for cat in ['Restaurant','Retail','Health & Wellness','Professional Services',
                               'Home Services','Auto','Entertainment','Education','Other'] %}
                <option>{{ cat }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Description</label>
              <textarea name="description" class="form-control" rows="3"
                        placeholder="Brief description of your products or services…"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Address</label>
              <input type="text" name="address" class="form-control"
                     placeholder="Street address, Spruce Grove, AB">
            </div>
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Phone</label>
                <input type="tel" name="phone" class="form-control" placeholder="(780) 555-0100">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Email</label>
                <input type="email" name="email" class="form-control" placeholder="info@yourbusiness.com">
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Website</label>
              <input type="url" name="website" class="form-control" placeholder="https://yourbusiness.com">
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-gazette px-4">Submit Listing</button>
              <a href="{{ url_for('directory') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
