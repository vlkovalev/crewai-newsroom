{% extends 'base.html' %}
{% block title %}Post a Classified — SG Gazette{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <h2 class="section-title">Post a Classified Ad</h2>
      <p class="text-muted mb-4">Free for Spruce Grove community members. Ads run for 30 days and are reviewed before publishing.</p>

      <div class="card">
        <div class="card-body p-4">
          <form method="post">
            <div class="mb-3">
              <label class="form-label fw-semibold">Title *</label>
              <input type="text" name="title" class="form-control" required
                     placeholder="e.g. For Sale: 2019 Honda Civic">
            </div>
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Category</label>
                <select name="category" class="form-select">
                  {% for cat in ['For Sale','Wanted','Housing','Jobs','Services','Free','Pets','Other'] %}
                  <option>{{ cat }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Price</label>
                <input type="text" name="price" class="form-control" placeholder="e.g. $500 or Free or OBO">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Description *</label>
              <textarea name="body" class="form-control" rows="5" required
                        placeholder="Describe your item or service in detail…"></textarea>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Contact Info *</label>
              <input type="text" name="contact" class="form-control" required
                     placeholder="Phone, email, or preferred contact method">
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-gazette px-4">Submit Ad</button>
              <a href="{{ url_for('classifieds') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
