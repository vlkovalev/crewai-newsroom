name: Keep Alive

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:          # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Gazette
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://spruce-grove-gazette.onrender.com/health)
          echo "Health status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: site returned $STATUS"
          fi
