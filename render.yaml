databases:
  - name: spruce-grove-gazette-db
    region: oregon
    plan: free
    databaseName: gazette
    user: gazette

services:
  - type: web
    name: spruce-grove-gazette
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn web_app:app --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TZ
        value: America/Edmonton
      - key: SCHEDULER_ENABLED
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: spruce-grove-gazette-db
          property: connectionString
      - key: GAZETTE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: GA_MEASUREMENT_ID
        sync: false

  # Morning cron — AI articles + RSS scraping (7 AM MDT = 13:00 UTC)
  - type: cron
    name: spruce-grove-news-bot
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python news_crew_enhanced.py && python news_scraper.py
    schedule: "0 13 * * *"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: spruce-grove-gazette-db
          property: connectionString
      - key: GAZETTE_BASE_URL
        value: https://spruce-grove-gazette.onrender.com
      - key: GAZETTE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # Evening cron — second AI batch + RSS (5 PM MDT = 23:00 UTC)
  - type: cron
    name: spruce-grove-evening-bot
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python news_crew_enhanced.py && python news_scraper.py
    schedule: "0 23 * * *"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: spruce-grove-gazette-db
          property: connectionString
      - key: GAZETTE_BASE_URL
        value: https://spruce-grove-gazette.onrender.com
      - key: GAZETTE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # Nightly maintenance — score decay, FTS update, stats (11 PM MDT = 05:00 UTC)
  - type: cron
    name: spruce-grove-maintenance
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python maintenance.py
    schedule: "0 5 * * *"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: spruce-grove-gazette-db
          property: connectionString
